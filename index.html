<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="clock" aria-label="24시간 시계판">
    <ol class="clock-face">
      <li style="--i: 0">0</li>
      <li style="--i: 1">1</li>
      <li style="--i: 2">2</li>
      <li style="--i: 3">3</li>
      <li style="--i: 4">4</li>
      <li style="--i: 5">5</li>
      <li style="--i: 6">6</li>
      <li style="--i: 7">7</li>
      <li style="--i: 8">8</li>
      <li style="--i: 9">9</li>
      <li style="--i: 10">10</li>
      <li style="--i: 11">11</li>
      <li style="--i: 12">12</li>
      <li style="--i: 13">13</li>
      <li style="--i: 14">14</li>
      <li style="--i: 15">15</li>
      <li style="--i: 16">16</li>
      <li style="--i: 17">17</li>
      <li style="--i: 18">18</li>
      <li style="--i: 19">19</li>
      <li style="--i: 20">20</li>
      <li style="--i: 21">21</li>
      <li style="--i: 22">22</li>
      <li style="--i: 23">23</li>
    </ol>
    <svg class="clock-arcs" viewBox="0 0 100 100" aria-hidden="true">
      <g id="clock-slices"></g>
      <g id="clock-arcs"></g>
    </svg>
  </section>

  <main class="card">
    <h1>할 일 목록</h1>
    <p id="subtitle" contenteditable="true" spellcheck="false">(이번 주 공부할 것)</p>

    <label for="todo-input">할 일</label>
    <input type="text" id="todo-input" placeholder="할 일을 적어 주세요">
    <select id="time-select" aria-label="걸리는 시간">
      <option value="10">10분</option>
      <option value="20">20분</option>
      <option value="30">30분</option>
      <option value="40">40분</option>
      <option value="50">50분</option>
      <option value="60">60분</option>
      <option value="70">70분</option>
      <option value="80">80분</option>
      <option value="90">90분</option>
      <option value="100">100분</option>
      <option value="110">110분</option>
      <option value="120">120분</option>
      <option value="130">130분</option>
      <option value="140">140분</option>
      <option value="150">150분</option>
      <option value="160">160분</option>
      <option value="170">170분</option>
      <option value="180">180분</option>
    </select>
    <button type="button" id="add-button">추가</button>

    <ul id="todo-list">
      <li>
        <span class="drag-handle" aria-hidden="true">⋮⋮</span>
        <label class="todo-item">
          <input type="checkbox" class="done-check">
          <span class="todo-text">영어</span>
        </label>
        <span class="todo-meta">
          <span class="todo-time">10분</span>
          <button type="button" class="star-button" aria-label="중요 표시" aria-pressed="false">☆</button>
          <button type="button" class="delete-button" aria-label="삭제">×</button>
        </span>
      </li>
      <li>
        <span class="drag-handle" aria-hidden="true">⋮⋮</span>
        <label class="todo-item">
          <input type="checkbox" class="done-check">
          <span class="todo-text">코딩</span>
        </label>
        <span class="todo-meta">
          <span class="todo-time">10분</span>
          <button type="button" class="star-button" aria-label="중요 표시" aria-pressed="false">☆</button>
          <button type="button" class="delete-button" aria-label="삭제">×</button>
        </span>
      </li>
      <li>
        <span class="drag-handle" aria-hidden="true">⋮⋮</span>
        <label class="todo-item">
          <input type="checkbox" class="done-check">
          <span class="todo-text">블렌더</span>
        </label>
        <span class="todo-meta">
          <span class="todo-time">10분</span>
          <button type="button" class="star-button" aria-label="중요 표시" aria-pressed="false">☆</button>
          <button type="button" class="delete-button" aria-label="삭제">×</button>
        </span>
      </li>
    </ul>

    <div id="counts">
      <p id="remaining">남은 할 일: <span class="count" id="remaining-count">3</span>개 (<span class="count" id="remaining-time">30</span>분)</p>
      <p id="done">완료한 일: <span class="count" id="done-count">0</span>개</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
