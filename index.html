<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>할 일 목록</h1>
  <p id="subtitle" contenteditable="true" spellcheck="false">(이번 주 공부할 것)</p>

  <label for="todo-input">할 일</label>
  <input type="text" id="todo-input" placeholder="할 일을 적어 주세요">
  <button type="button" id="add-button">추가</button>

  <ul id="todo-list">
    <li>영어</li>
    <li>코딩</li>
    <li>블렌더</li>
  </ul>

  <p id="remaining">남은 할 일: 3개</p>
</body>
</html>
