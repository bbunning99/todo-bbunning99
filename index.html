<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>할 일 목록</h1>
  <p id="subtitle" contenteditable="true" spellcheck="false">(이번 주 공부할 것)</p>

  <label for="todo-input">할 일</label>
  <input type="text" id="todo-input" placeholder="할 일을 적어 주세요">
  <button type="button" id="add-button">추가</button>

  <ul id="todo-list">
    <li>
      <span class="todo-text">영어</span>
      <button type="button" class="delete-button">삭제</button>
    </li>
    <li>
      <span class="todo-text">코딩</span>
      <button type="button" class="delete-button">삭제</button>
    </li>
    <li>
      <span class="todo-text">블렌더</span>
      <button type="button" class="delete-button">삭제</button>
    </li>
  </ul>

  <p id="remaining">남은 할 일: <span class="count" id="remaining-count">3</span>개</p>
  <script src="script.js"></script>
</body>
</html>
